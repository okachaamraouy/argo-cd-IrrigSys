apiVersion: apps/v1
kind: Deployment

metadata:
  name: irrigsys

spec:
  replicas: 1

  selector:
    matchLabels:
      app: irrigsys

  template:
    metadata:
      labels:
        app: irrigsys

    spec:
      containers:
        - name: irrigsys
          image: nginx:latest

          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: 50m
              memory: 64Mi

            limits:
              cpu: 200m
              memory: 128Mi
